config:
  edition: 3
# The app downloads orders through the optical_order_feed RPC (migration 022) and uploads through
# apply_optical_order / upsert_optical_customer. If a PowerSync service is added later, stream these owner-scoped tables.
streams:
  shop:
    auto_subscribe: true
    queries:
      - SELECT * FROM optical_customers WHERE user_id = auth.user_id()
      - SELECT * FROM optical_orders WHERE user_id = auth.user_id()
      - SELECT * FROM optical_payments WHERE user_id = auth.user_id()
