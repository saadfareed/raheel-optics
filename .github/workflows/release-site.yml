# Publishes release-site/ (privacy policy and account-deletion pages for Google Play) to GitHub Pages.
# One-time setup: repo Settings > Pages > Source: "GitHub Actions".
name: Release site
on:
  push:
    branches: [main]
    paths: ["release-site/**", ".github/workflows/release-site.yml"]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test release-site/deletion.test.cjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: release-site
      - id: deployment
        uses: actions/deploy-pages@v4
