# Deploys the delete-account Edge Function to Supabase (verify_jwt comes from supabase/config.toml).
# One-time setup: repo Settings > Secrets and variables > Actions:
#   secret   SUPABASE_ACCESS_TOKEN  (Supabase dashboard > Account > Access tokens)
#   variable SUPABASE_PROJECT_REF   (e.g. nfnumouljfpvumzuorav)
name: Delete-account function
on:
  push:
    branches: [main]
    paths: ["supabase/functions/delete-account/**", "supabase/config.toml", ".github/workflows/delete-account-function.yml"]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: supabase-functions
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test supabase/functions/delete-account/handler.test.mjs
      - name: Deploy
        run: |
          test -n "$SUPABASE_ACCESS_TOKEN" || { echo "::error::Add the SUPABASE_ACCESS_TOKEN secret."; exit 1; }
          test -n "$PROJECT_REF" || { echo "::error::Add the SUPABASE_PROJECT_REF variable."; exit 1; }
          npx --yes supabase@2 functions deploy delete-account --project-ref "$PROJECT_REF" --use-api
      - name: Check it answers
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' -X OPTIONS "https://$PROJECT_REF.supabase.co/functions/v1/delete-account")
          echo "OPTIONS delete-account -> HTTP $code"
          test "$code" != 404
