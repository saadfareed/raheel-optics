# Daily: keeps the free Supabase project from pausing (it pauses after 7 days without activity) and saves an
# encrypted backup (the free plan has none you can download). Backups are kept as workflow artifacts for 30 days.
# One-time setup: repo Settings > Secrets and variables > Actions:
#   secret DATABASE_URL       session-pooler connection string (same as .env)
#   secret BACKUP_PASSPHRASE  encrypts the backup (same as .env); without it the backup cannot be opened
# Restore: see docs/BACKEND.md "Backups".
name: Keep alive and back up
on:
  schedule:
    - cron: "30 21 * * *"   # 02:30 Pakistan time
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: keep-alive-backup
  cancel-in-progress: false
jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
    steps:
      - name: Check settings
        run: |
          test -n "$DATABASE_URL" || { echo "::error::Add the DATABASE_URL secret."; exit 1; }
          test -n "$BACKUP_PASSPHRASE" || { echo "::error::Add the BACKUP_PASSPHRASE secret."; exit 1; }
      - name: Install PostgreSQL 17 client
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-common >/dev/null
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y >/dev/null
          sudo apt-get install -y -qq postgresql-client-17 >/dev/null
      - name: Keep the project awake
        run: |
          /usr/lib/postgresql/17/bin/psql "$DATABASE_URL" -XAtqc "select 'Orders: '||count(*) from public.optical_orders"
      - name: Back up and encrypt
        run: |
          set -euo pipefail
          B=/usr/lib/postgresql/17/bin; D=$(date -u +%Y%m%d); mkdir -p out work
          $B/pg_dump "$DATABASE_URL" --schema=public -Fc --no-owner --no-privileges -f work/public.dump
          $B/pg_dump "$DATABASE_URL" --data-only -Fc -t auth.users -t auth.identities -f work/auth.dump
          tar -C work -czf - public.dump auth.dump | gpg --batch --yes --pinentry-mode loopback \
            --passphrase-fd 3 --symmetric --cipher-algo AES256 -o "out/raheel-optics-$D.tar.gz.gpg" 3<<<"$BACKUP_PASSPHRASE"
          rm -rf work; ls -la out
      - uses: actions/upload-artifact@v4
        with:
          name: db-backup-${{ github.run_id }}
          path: out/
          retention-days: 30
          if-no-files-found: error
